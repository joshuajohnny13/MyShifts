    <script type="text/babel" data-type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, getDoc, updateDoc } from "firebase/firestore";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

        const { useState, useEffect } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCMoeSoLfsNgcopCH76m2wyHYgHnd9aiyM",
            authDomain: "myshifts-daf0d.firebaseapp.com",
            projectId: "myshifts-daf0d",
            storageBucket: "myshifts-daf0d.firebasestorage.app",
            messagingSenderId: "651463733952",
            appId: "1:651463733952:web:80ad8813b209ee18627325",
            measurementId: "G-599ZPDXQV1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- UTILITIES ---
        const formatLocalYYYYMMDD = (dateObj) => {
            if (!dateObj) return '';
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const parseLocalYYYYMMDD = (dateStr) => {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const calculateShiftHours = (start, end) => {
            if (!start || !end) return 0;
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            let startMin = h1 * 60 + m1;
            let endMin = h2 * 60 + m2;
            if (endMin <= startMin) endMin += 24 * 60; 
            return (endMin - startMin) / 60;
        };

        const isShiftForUser = (shift, userEmail, userName) => {
            if (shift.workerEmail === 'all' || shift.worker === 'All') return true;
            if (shift.workerEmail && userEmail && shift.workerEmail.toLowerCase() === userEmail.toLowerCase()) return true;
            if (shift.worker && userName && shift.worker.toLowerCase() === userName.toLowerCase()) return true;
            return false;
        };

        // --- COMPONENTS ---

        function AuthScreen() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState('employee');
            const [adminCode, setAdminCode] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        if (role === 'admin' && adminCode !== 'ADMIN2026') throw new Error("Invalid Admin Passcode.");
                        if (!name) throw new Error("Full Name is required.");
                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, "users", cred.user.uid), { name, email, role });
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-teal-800 p-4">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <i className="fa-regular fa-calendar-check text-5xl text-teal-600 mb-3"></i>
                            <h1 className="text-3xl font-black text-gray-800 tracking-tight">MyShifts</h1>
                            <p className="text-gray-500 mt-2 text-sm">{isLogin ? 'Welcome back, please sign in.' : 'Create your account to view shifts.'}</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm font-medium border border-red-200">{error}</div>}
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Email</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Password</label>
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none" />
                            </div>
                            {!isLogin && (
                                <div className="space-y-4 bg-gray-50 p-4 border rounded">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Full Name</label>
                                        <input type="text" required={!isLogin} value={name} onChange={e => setName(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Account Role</label>
                                        <select value={role} onChange={e => setRole(e.target.value)} className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                                            <option value="employee">Standard Employee</option>
                                            <option value="admin">Administrator</option>
                                        </select>
                                    </div>
                                    {role === 'admin' && (
                                        <div className="bg-red-50 p-3 rounded border border-red-200">
                                            <label className="block text-xs font-bold text-red-700 uppercase tracking-widest mb-1">Admin Passcode</label>
                                            <input type="password" required={role === 'admin'} value={adminCode} onChange={e => setAdminCode(e.target.value)} className="w-full p-3 border border-red-300 rounded focus:ring-2 focus:ring-red-500 outline-none font-mono" placeholder="Secret Code" />
                                        </div>
                                    )}
                                </div>
                            )}
                            <button type="submit" disabled={loading} className="w-full bg-teal-600 text-white font-bold py-3 rounded hover:bg-teal-700 transition-colors shadow-md disabled:opacity-50">
                                {loading ? 'Processing...' : (isLogin ? 'Sign In' : 'Create Account')}
                            </button>
                        </form>
                        <div className="text-center mt-6">
                            <button onClick={() => setIsLogin(!isLogin)} className="text-teal-600 text-sm font-semibold hover:underline">
                                {isLogin ? "Need an account? Sign up" : "Already have an account? Sign in"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ShiftDetailsModal({ shift, onClose }) {
            if (!shift) return null;
            const hours = calculateShiftHours(shift.startTime, shift.endTime);
            const dateObj = parseLocalYYYYMMDD(shift.date);
            const dateStr = dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-teal-700 text-white p-4 flex justify-between items-center shadow-inner">
                            <h3 className="font-black tracking-wider uppercase text-sm">Shift Details</h3>
                            <button onClick={onClose} className="text-teal-200 hover:text-white transition-colors"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div className="text-center border-b border-gray-100 pb-5">
                                <div className="text-xs text-gray-500 font-bold uppercase tracking-widest mb-2">{dateStr}</div>
                                <div className="text-xl font-bold text-teal-700 mb-2">{shift.workerName || shift.worker || 'Open Shift'}</div>
                                <div className="text-4xl font-black text-gray-800 tracking-tighter flex items-center justify-center gap-2">
                                    {shift.startTime} <span className="text-teal-400 text-2xl">→</span> {shift.endTime}
                                </div>
                                <div className="mt-3 inline-block bg-teal-50 text-teal-800 border border-teal-200 px-4 py-1.5 rounded-full font-black text-sm shadow-sm">
                                    {hours.toFixed(2)} Hours
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3 pt-2">
                                <div className="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center shadow-sm">
                                    <i className="fa-solid fa-location-dot text-gray-300 mb-1.5 block text-xl"></i>
                                    <div className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Location</div>
                                    <div className="font-black text-gray-800 text-lg truncate px-1">{shift.location || 'N/A'}</div>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center shadow-sm">
                                    <i className="fa-solid fa-user-tag text-gray-300 mb-1.5 block text-xl"></i>
                                    <div className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Role</div>
                                    <div className="font-black text-gray-800 text-lg truncate px-1" title={shift.role}>{shift.role || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function RosterGrid({ shifts, baseDate, setBaseDate, userName, userEmail, onShiftClick }) {
            const getAnchorOffsetDays = (currentBase) => {
                const anchor = new Date('2026-06-08T00:00:00');
                const cbMidnight = new Date(currentBase.getFullYear(), currentBase.getMonth(), currentBase.getDate());
                const diffTime = cbMidnight.getTime() - anchor.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const cycleOffset = diffDays % 21;
                return cycleOffset >= 0 ? cycleOffset : 21 + cycleOffset;
            };

            const cycleStart = new Date(baseDate);
            cycleStart.setDate(cycleStart.getDate() - getAnchorOffsetDays(baseDate));

            const calendarDays = Array.from({ length: 21 }).map((_, i) => {
                const d = new Date(cycleStart);
                d.setDate(d.getDate() + i);
                return d;
            });

            const weeks = [calendarDays.slice(0, 7), calendarDays.slice(7, 14), calendarDays.slice(14, 21)];
            const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            const getShiftForDay = (dateObj) => {
                const formattedDate = formatLocalYYYYMMDD(dateObj);
                return shifts.find(s => s.date === formattedDate && isShiftForUser(s, userEmail, userName));
            };

            const formatDate = (date) => date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            let totalCycleHours = 0;

            return (
                <div className="w-full bg-white sm:border rounded sm:shadow-sm overflow-hidden">
                    <div className="p-2 sm:p-4 border-b flex justify-between items-center bg-gray-50">
                        <button onClick={() => { const d = new Date(baseDate); d.setDate(d.getDate() - 21); setBaseDate(d); }} className="p-1 sm:p-2 bg-white border rounded shadow-sm hover:bg-gray-100 font-bold"><i className="fa-solid fa-chevron-left"></i></button>
                        <div className="text-xs sm:text-lg font-black text-gray-800 uppercase tracking-widest">
                            {formatDate(calendarDays[0])} - {formatDate(calendarDays[20])}
                        </div>
                        <button onClick={() => { const d = new Date(baseDate); d.setDate(d.getDate() + 21); setBaseDate(d); }} className="p-1 sm:p-2 bg-white border rounded shadow-sm hover:bg-gray-100 font-bold"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div className="overflow-hidden sm:overflow-x-auto">
                        <div className="w-full sm:min-w-[700px]">
                            <div className="grid grid-cols-[25px_repeat(7,minmax(0,1fr))] sm:grid-cols-[40px_repeat(7,minmax(0,1fr))] bg-slate-500 text-white font-bold text-center text-[10px] sm:text-sm py-1 sm:py-2">
                                <div></div>
                                {dayLabels.map(day => <div key={day} className="truncate px-0.5">{day}</div>)}
                            </div>
                            {weeks.map((week, wIndex) => {
                                const firstDay = new Date(week[0].getFullYear(), 0, 1);
                                const daysToFirstDay = Math.floor((week[0] - firstDay) / (24 * 60 * 60 * 1000));
                                const weekNum = Math.ceil((week[0].getDay() + 1 + daysToFirstDay) / 7);

                                return (
                                    <div key={wIndex} className="grid grid-cols-[25px_repeat(7,minmax(0,1fr))] sm:grid-cols-[40px_repeat(7,minmax(0,1fr))] border-b border-gray-200">
                                        <div className="bg-gray-50 flex items-center justify-center text-gray-400 text-[9px] sm:text-xs font-bold border-r border-gray-200">{weekNum}</div>
                                        {week.map((day, dIndex) => {
                                            const shift = getShiftForDay(day);
                                            if (shift) totalCycleHours += calculateShiftHours(shift.startTime, shift.endTime);
                                            const isWeekend = dIndex === 5 || dIndex === 6;
                                            const isToday = formatLocalYYYYMMDD(new Date()) === formatLocalYYYYMMDD(day);

                                            return (
                                                <div key={dIndex} onClick={() => shift && onShiftClick(shift)} className={`min-h-[70px] sm:min-h-[100px] border-r border-gray-200 flex flex-col ${shift ? 'bg-[#e0f2fe] cursor-pointer hover:bg-blue-100 transition-colors' : 'bg-white'} ${isToday ? 'ring-2 ring-teal-500 inset-0 relative z-10' : ''}`}>
                                                    <div className={`text-right p-0.5 sm:p-1 text-[10px] sm:text-sm ${isWeekend ? 'text-red-600 font-bold' : 'text-gray-500'}`}>{day.getDate()}</div>
                                                    {shift && (
                                                        <div className="flex-1 flex flex-col items-center justify-center p-0.5 sm:p-1 text-gray-900 pb-1 sm:pb-2 overflow-hidden">
                                                            <span className="font-extrabold text-[11px] sm:text-[15px] leading-none sm:leading-tight">{shift.startTime.replace(':','')}</span>
                                                            <span className="font-extrabold text-[11px] sm:text-[15px] leading-none sm:leading-tight mb-0.5 sm:mb-1">{shift.endTime.replace(':','')}</span>
                                                            <span className="text-[8px] sm:text-[10px] uppercase tracking-tighter sm:tracking-wider text-gray-600 truncate w-full text-center px-0.5">{shift.location}</span>
                                                            <span className="hidden sm:block text-[10px] leading-tight text-center px-1 text-gray-500 truncate w-full">{shift.role}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    <div className="p-2 sm:p-4 bg-teal-50 border-t text-right text-xs sm:text-base font-black text-teal-800">

        function MonthView({ shifts, baseDate, setBaseDate, userName, userEmail, onShiftClick }) {
            const getDaysInMonth = () => {
                const year = baseDate.getFullYear();
                const month = baseDate.getMonth();
                const date = new Date(year, month, 1);
                const days = [];
                let startDay = date.getDay() === 0 ? 6 : date.getDay() - 1;
                for(let i = 0; i < startDay; i++) days.push(null);
                while (date.getMonth() === month) {
                    days.push(new Date(date));
                    date.setDate(date.getDate() + 1);
                }
                return days;
            };

            const days = getDaysInMonth();
            const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            const getShiftForDay = (dateObj) => {
                if(!dateObj) return null;
                const formattedDate = formatLocalYYYYMMDD(dateObj);
                return shifts.find(s => s.date === formattedDate && isShiftForUser(s, userEmail, userName));
            };

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            let totalMonthHours = 0;

            return (

                            <div>{monthNames[baseDate.getMonth()]} {baseDate.getFullYear()}</div>
                        </div>
                        <button onClick={() => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1))} className="p-1 sm:p-2 bg-white border rounded shadow-sm hover:bg-gray-100 font-bold"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div className="overflow-hidden sm:overflow-x-auto">
                        <div className="w-full sm:min-w-[700px]">
                            <div className="grid grid-cols-[25px_repeat(7,minmax(0,1fr))] sm:grid-cols-[40px_repeat(7,minmax(0,1fr))] bg-slate-500 text-white font-bold text-center text-[10px] sm:text-sm py-1 sm:py-2">
                                <div></div>
                                {dayLabels.map(day => <div key={day} className="truncate px-0.5">{day}</div>)}
                            </div>
                            
                            {/* We calculate weeks dynamically for the month view just like the roster view */}
                            {(() => {
                                const weeks = [];
                                let currentWeek = [];
                                days.forEach((day, i) => {
                                    currentWeek.push(day);
                                    if (currentWeek.length === 7 || i === days.length - 1) {
                                        // Pad the last week if it doesn't end on a Sunday
                                        while(currentWeek.length < 7) currentWeek.push(null);
                                        weeks.push(currentWeek);
                                        currentWeek = [];
                                    }
                                });

                                return weeks.map((week, wIndex) => {
                                    // Find a valid day in the week to determine the week number
                                    const validDay = week.find(d => d !== null);
                                    let weekNum = "";
                                    if (validDay) {
                                        const firstDay = new Date(validDay.getFullYear(), 0, 1);
                                        const daysToFirstDay = Math.floor((validDay - firstDay) / (24 * 60 * 60 * 1000));
                                        weekNum = Math.ceil((validDay.getDay() + 1 + daysToFirstDay) / 7);
                                    }

                                    return (
                                        <div key={wIndex} className="grid grid-cols-[25px_repeat(7,minmax(0,1fr))] sm:grid-cols-[40px_repeat(7,minmax(0,1fr))] border-b border-gray-200">
                                            <div className="bg-gray-50 flex items-center justify-center text-gray-400 text-[9px] sm:text-xs font-bold border-r border-gray-200">{weekNum}</div>
                                            {week.map((day, dIndex) => {
                                                const shift = getShiftForDay(day);
                                                if (shift) totalMonthHours += calculateShiftHours(shift.startTime, shift.endTime);
                                                const isWeekend = dIndex === 5 || dIndex === 6;
                                                
                                                if(!day) return <div key={`empty-${wIndex}-${dIndex}`} className="min-h-[70px] sm:min-h-[100px] border-r border-gray-100 bg-gray-50"></div>;

                                                const isToday = formatLocalYYYYMMDD(new Date()) === formatLocalYYYYMMDD(day);

                                                return (
                                                    <div key={dIndex} onClick={() => shift && onShiftClick(shift)} className={`min-h-[70px] sm:min-h-[100px] border-r border-gray-200 flex flex-col ${shift ? 'bg-[#e0f2fe] cursor-pointer hover:bg-blue-100 transition-colors' : 'bg-white'} ${isToday ? 'ring-2 ring-teal-500 inset-0 relative z-10' : ''}`}>
                                                        <div className={`text-right p-0.5 sm:p-1 text-[10px] sm:text-sm ${isWeekend ? 'text-red-600 font-bold' : 'text-gray-500'}`}>{day.getDate()}</div>
                                                        {shift && (
                                                            <div className="flex-1 flex flex-col items-center justify-center p-0.5 sm:p-1 text-gray-900 pb-1 sm:pb-2 overflow-hidden">
                                                                <span className="font-extrabold text-[11px] sm:text-[15px] leading-none sm:leading-tight">{shift.startTime.replace(':','')}</span>
                                                                <span className="font-extrabold text-[11px] sm:text-[15px] leading-none sm:leading-tight mb-0.5 sm:mb-1">{shift.endTime.replace(':','')}</span>
                                                                <span className="text-[8px] sm:text-[10px] uppercase tracking-tighter sm:tracking-wider text-gray-600 truncate w-full text-center px-0.5">{shift.location}</span>
                                                                <span className="hidden sm:block text-[10px] leading-tight text-center px-1 text-gray-500 truncate w-full">{shift.role}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                });
                            })()}
                        </div>
                    </div>

                    <div className="p-2 sm:p-4 bg-teal-50 border-t text-right text-xs sm:text-base font-black text-teal-800">
                        Monthly Total: {totalMonthHours.toFixed(2)} Hours
                    </div>
                </div>
            );
        }

        // --- NEW HORIZONTAL SHIFT LIST (TEAM VIEW) ---
        function ShiftListView({ shifts, staff, onShiftClick }) {
            const [baseDate, setBaseDate] = useState(new Date());

            const getAnchorOffsetDays = (currentBase) => {
                const anchor = new Date('2026-06-08T00:00:00');
                const cbMidnight = new Date(currentBase.getFullYear(), currentBase.getMonth(), currentBase.getDate());
                const diffTime = cbMidnight.getTime() - anchor.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const cycleOffset = diffDays % 21;
                return cycleOffset >= 0 ? cycleOffset : 21 + cycleOffset;
            };

            const cycleStart = new Date(baseDate);
            cycleStart.setDate(cycleStart.getDate() - getAnchorOffsetDays(baseDate));

            const days = Array.from({ length: 21 }).map((_, i) => {
                const d = new Date(cycleStart);
                d.setDate(d.getDate() + i);
                return d;
            });

            const getShift = (workerName, workerEmail, dateObj) => {
                const dateStr = formatLocalYYYYMMDD(dateObj);
                return shifts.find(s => s.date === dateStr && (
                    s.worker === 'All' || s.workerEmail === 'all' || 
                    (s.workerEmail && s.workerEmail.toLowerCase() === workerEmail?.toLowerCase()) || 
                    (s.worker && s.worker.toLowerCase() === workerName?.toLowerCase())
                ));
            };

            return (
                <div className="bg-white sm:rounded-xl shadow-sm sm:border border-gray-200 overflow-hidden">

                        <div className="font-black text-gray-800 text-xs sm:text-lg tracking-widest uppercase">

                        </div>
                        <button onClick={() => { const d = new Date(baseDate); d.setDate(d.getDate() + 21); setBaseDate(d); }} className="p-1 sm:p-2 bg-white border rounded shadow-sm hover:bg-gray-100 font-bold"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                                    <tr>

                                        <th className="px-2 py-2 text-center border-r border-slate-600 bg-slate-600 z-10 w-20">Cycle Hrs</th>
                                        {days.map((day, i) => (
                                            <th key={i} className={`px-1 py-2 text-center border-r border-slate-600 min-w-[65px] ${day.getDay() === 0 || day.getDay() === 6 ? 'text-red-300' : ''}`}>

                                            </th>

                                                    const isToday = formatLocalYYYYMMDD(day) === formatLocalYYYYMMDD(new Date());

                                                    <button onClick={() => { setEditingStaffId(s.id); setEditStaffData({name: s.name, email: s.email || ''}); }} className="p-1.5 text-gray-400 hover:text-teal-600 bg-gray-50 rounded hover:bg-teal-50 transition-colors"><i className="fa-solid fa-pen-to-square"></i></button>
                                                    {confirmStaffId === s.id ? (
                                                        <div className="flex items-center gap-1 bg-red-50 rounded px-2 py-1 border border-red-100">
                                                            <button onClick={() => deleteDoc(doc(db, "staff", s.id))} className="text-[10px] font-bold text-red-600 hover:underline">Yes</button>
                                                            <span className="text-gray-300">|</span>
                                                            <button onClick={() => setConfirmStaffId(null)} className="text-[10px] font-bold text-gray-500 hover:underline">No</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => setConfirmStaffId(s.id)} className="p-1.5 text-gray-400 hover:text-red-500 bg-gray-50 rounded hover:bg-red-50 transition-colors"><i className="fa-solid fa-trash"></i></button>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {staff.length === 0 && <span className="text-xs text-gray-400 italic text-center p-2">No staff added.</span>}
                            </div>
                        </div>
                    </div>

                    {/* Database Column */}
                    <div className="lg:col-span-2 bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col h-[600px]">
                        <div className="bg-gray-50 p-4 border-b">
                            <h3 className="font-black text-gray-800 uppercase tracking-widest">Active Shift Database</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {shifts.length === 0 ? <p className="text-sm text-gray-400 text-center py-10 font-medium">No shifts found in database.</p> : null}
                            {shifts.sort((a,b) => parseLocalYYYYMMDD(b.date) - parseLocalYYYYMMDD(a.date)).map(s => (
                                <div key={s.id} className={`flex flex-col sm:flex-row justify-between sm:items-center p-4 border rounded-lg transition-colors ${editingId === s.id ? 'bg-orange-50 border-orange-200' : 'hover:bg-gray-50 border-gray-100'}`}>
                                    <div className="flex items-center gap-4 mb-3 sm:mb-0">
                                        <div className="bg-gray-100 text-gray-600 font-bold px-3 py-2 rounded text-sm font-mono border w-28 text-center">{s.date}</div>
                                        <div>
                                            <div className="font-black text-teal-800 text-lg">{s.workerName || s.worker}</div>
                                            <div className="text-xs text-gray-500 font-bold mt-0.5">
                                                {s.startTime} - {s.endTime} <span className="mx-1">•</span> <span className="text-gray-800 uppercase">{s.location}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 justify-end items-center">
                                        <button onClick={() => handleEditShift(s)} className="flex items-center gap-1 bg-white border border-gray-200 text-gray-600 hover:text-teal-600 hover:border-teal-300 px-3 py-1.5 rounded text-xs font-bold transition-all shadow-sm">
                                            <i className="fa-solid fa-pen-to-square"></i> Edit
                                        </button>
                                        
                                        {confirmDeleteId === s.id ? (
                                            <div className="flex items-center gap-2 bg-red-50 border border-red-100 rounded px-2 py-1 shadow-sm">
                                                <span className="text-[10px] font-bold text-red-600 uppercase">Delete?</span>
                                                <button onClick={() => deleteDoc(doc(db, "shifts", s.id))} className="text-xs font-bold text-red-700 hover:underline">Yes</button>
                                                <span className="text-gray-300">|</span>
                                                <button onClick={() => setConfirmDeleteId(null)} className="text-xs font-bold text-gray-500 hover:underline">No</button>
                                            </div>
                                        ) : (
                                            <button onClick={() => setConfirmDeleteId(s.id)} className="flex items-center gap-1 bg-white border border-red-100 text-red-500 hover:bg-red-50 px-3 py-1.5 rounded text-xs font-bold transition-all shadow-sm">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function MyShiftsApp() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [activeTab, setActiveTab] = useState('ROSTER');
            const [shifts, setShifts] = useState([]);
            const [staff, setStaff] = useState([]);
            const [loading, setLoading] = useState(true);
            const [baseDate, setBaseDate] = useState(new Date()); // Dynamic current cycle initialization
            const [upgradeCode, setUpgradeCode] = useState('');
            const [selectedShift, setSelectedShift] = useState(null);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                            if (userDoc.exists()) setUserData(userDoc.data());
                            else setUserData({ name: currentUser.email, role: 'employee', email: currentUser.email });
                        } catch (e) { console.error(e); }
                    } else {
                        setUserData(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const shiftSub = onSnapshot(collection(db, "shifts"), (snapshot) => {
                    setShifts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const staffSub = onSnapshot(collection(db, "staff"), (snapshot) => {
                    setStaff(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { shiftSub(); staffSub(); };
            }, [user]);

            const handleUpgradeToAdmin = async () => {
                if (upgradeCode === 'ADMIN2026') {
                    await setDoc(doc(db, "users", user.uid), { ...userData, role: 'admin' }, { merge: true });
                    setUserData({ ...userData, role: 'admin' });
                    setUpgradeCode('');
                } else alert('Invalid Code');
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-teal-600 font-bold animate-pulse">Loading System...</div>;
            if (!user) return <AuthScreen />;

            return (
                <div className="max-w-5xl mx-auto bg-white min-h-screen font-sans text-gray-800 sm:shadow-2xl relative pb-20 sm:pb-0">
                    <div className="flex justify-between items-center px-4 py-4 bg-teal-700 text-white shadow-md">
                        <h1 className="text-xl font-black tracking-wider flex items-center gap-2"><i className="fa-regular fa-calendar-check"></i> MYSHIFTS</h1>
                        <div className="flex items-center gap-4">
                            {userData?.role !== 'admin' && (
                                <div className="hidden sm:flex items-center gap-2 bg-teal-800 p-1.5 rounded border border-teal-600">
                                    <input type="password" placeholder="Admin Code" className="w-24 text-xs p-1 text-gray-900 rounded outline-none" value={upgradeCode} onChange={e => setUpgradeCode(e.target.value)} />
                                    <button onClick={handleUpgradeToAdmin} className="text-xs font-bold px-2 hover:text-teal-200">Upgrade</button>
                                </div>
                            )}
                            <div className="text-right hidden sm:block">
                                <div className="text-sm font-bold">{userData?.name}</div>
                                <div className="text-xs text-teal-200 uppercase tracking-widest">{userData?.role}</div>
                            </div>
                            <button onClick={() => signOut(auth)} className="text-xs px-3 py-1.5 bg-teal-800 rounded hover:bg-teal-900 font-bold transition-colors border border-teal-600">Sign Out</button>
                        </div>
                    </div>

                    <div className="flex bg-gray-100 border-b shadow-sm overflow-x-auto hide-scrollbar sticky top-0 z-40">
                        {[
                            { id: 'MONTH', icon: 'fa-calendar-days', label: 'Month' },
                            { id: 'ROSTER', icon: 'fa-table-cells', label: 'Roster' },
                            { id: 'DAY', icon: 'fa-calendar-day', label: 'Day List' },
                            { id: 'TEAM', icon: 'fa-users', label: 'Shift List' },
                            userData?.role === 'admin' ? { id: 'MANAGE', icon: 'fa-user-tie', label: 'Manage' } : null
                        ].filter(Boolean).map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center justify-center gap-2 flex-1 min-w-[120px] px-4 py-3 text-sm font-bold uppercase tracking-wider transition-colors border-b-4 ${activeTab === tab.id ? 'border-teal-600 text-teal-700 bg-white' : 'border-transparent text-gray-500 hover:text-teal-600 hover:bg-gray-50'}`}>
                                <i className={`fa-solid ${tab.icon}`}></i> {tab.label}
                            </button>
                        ))}
                    </div>

                    <div className="p-0 sm:p-4 bg-gray-50/50 min-h-[calc(100vh-140px)]">
                        {activeTab === 'MONTH' && <MonthView shifts={shifts} baseDate={baseDate} setBaseDate={setBaseDate} userName={userData?.name} userEmail={user?.email} onShiftClick={setSelectedShift} />}
                        {activeTab === 'ROSTER' && <RosterGrid shifts={shifts} baseDate={baseDate} setBaseDate={setBaseDate} userName={userData?.name} userEmail={user?.email} onShiftClick={setSelectedShift} />}
                        {activeTab === 'DAY' && <DayView shifts={shifts} onShiftClick={setSelectedShift} />}
                        {activeTab === 'TEAM' && <ShiftListView shifts={shifts} staff={staff} onShiftClick={setSelectedShift} />}
                        {activeTab === 'MANAGE' && userData?.role === 'admin' && <ManageView shifts={shifts} staff={staff} userRole={userData?.role} db={db} />}
                    </div>

                    {selectedShift && <ShiftDetailsModal shift={selectedShift} onClose={() => setSelectedShift(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MyShiftsApp />);
    </script>
</body>
</html>
