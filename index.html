<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyShifts</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- UPDATED: Modern Babel 7 Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Import Map -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"
        }
      }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, getDoc, updateDoc, writeBatch } from "firebase/firestore";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

        const { useState, useEffect } = React;

        // --- REPLACE THESE WITH YOUR FIREBASE KEYS IF NEEDED ---
        const firebaseConfig = {
            apiKey: "AIzaSyCMoeSoLfsNgcopCH76m2wyHYgHnd9aiyM",
            authDomain: "myshifts-daf0d.firebaseapp.com",
            projectId: "myshifts-daf0d",
            storageBucket: "myshifts-daf0d.firebasestorage.app",
            messagingSenderId: "651463733952",
            appId: "1:651463733952:web:80ad8813b209ee18627325",
            measurementId: "G-599ZPDXQV1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const calculateShiftHours = (start, end) => {
            if (!start || !end) return 0;
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            let startMin = h1 * 60 + m1;
            let endMin = h2 * 60 + m2;
            if (endMin <= startMin) endMin += 24 * 60; // Cross-midnight handler
            return (endMin - startMin) / 60;
        };

        const isShiftForUser = (shift, userName, userEmail) => {
            if (shift.workerEmail === 'all' || shift.worker === 'All' || shift.workerName === 'All Staff') return true;
            if (shift.workerEmail && userEmail && shift.workerEmail.toLowerCase() === userEmail.toLowerCase()) return true;
            if (shift.worker && userName && shift.worker.toLowerCase() === userName.toLowerCase()) return true;
            if (shift.workerName && userName && shift.workerName.toLowerCase() === userName.toLowerCase()) return true;
            return false;
        };

        function ShiftDetailsModal({ shift, onClose }) {
            if (!shift) return null;
            const hours = calculateShiftHours(shift.startTime, shift.endTime);
            const dateObj = new Date(shift.date);
            const dateStr = dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-teal-700 text-white p-4 flex justify-between items-center shadow-inner">
                            <h3 className="font-black tracking-wider uppercase text-sm">Shift Details</h3>
                            <button onClick={onClose} className="text-teal-200 hover:text-white transition-colors"><i className="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div className="text-center border-b border-gray-100 pb-5">
                                <div className="text-xs text-gray-500 font-bold uppercase tracking-widest mb-2">{dateStr}</div>
                                <div className="text-4xl font-black text-gray-800 tracking-tighter flex items-center justify-center gap-2">
                                    {shift.startTime} <span className="text-teal-400 text-2xl">→</span> {shift.endTime}
                                </div>
                                <div className="mt-3 inline-block bg-teal-50 text-teal-800 border border-teal-200 px-4 py-1.5 rounded-full font-black text-sm shadow-sm">
                                    {hours.toFixed(2)} Hours
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3 pt-2">
                                <div className="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center shadow-sm">
                                    <i className="fa-solid fa-location-dot text-gray-300 mb-1.5 block text-xl"></i>
                                    <div className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Location</div>
                                    <div className="font-black text-gray-800 text-lg truncate px-1">{shift.location || 'N/A'}</div>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center shadow-sm">
                                    <i className="fa-solid fa-user-tag text-gray-300 mb-1.5 block text-xl"></i>
                                    <div className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Role</div>
                                    <div className="font-black text-gray-800 text-lg truncate px-1" title={shift.role}>{shift.role || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MyShiftsApp() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [activeTab, setActiveTab] = useState('ROSTER');
            const [shifts, setShifts] = useState([]);
            const [staff, setStaff] = useState([]);
            const [loading, setLoading] = useState(true);
            const [baseDate, setBaseDate] = useState(new Date());
            const [upgradeCode, setUpgradeCode] = useState('');
            const [selectedShift, setSelectedShift] = useState(null);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                            if (userDoc.exists()) setUserData(userDoc.data());
                            else setUserData({ name: currentUser.email, role: 'employee', email: currentUser.email });
                        } catch (e) { console.error(e); }
                    } else {
                        setUserData(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const shiftSub = onSnapshot(collection(db, "shifts"), (snapshot) => {
                    setShifts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const staffSub = onSnapshot(collection(db, "staff"), (snapshot) => {
                    setStaff(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { shiftSub(); staffSub(); };
            }, [user]);

            const handleUpgradeToAdmin = async () => {
                if (upgradeCode === 'ADMIN2026') {
                    await setDoc(doc(db, "users", user.uid), { ...userData, role: 'admin' }, { merge: true });
                    setUserData({ ...userData, role: 'admin' });
                    setUpgradeCode('');
                } else alert('Invalid Code');
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-teal-600 font-bold animate-pulse">Loading System...</div>;
            if (!user) return <AuthScreen />;

            return (
                <div className="max-w-5xl mx-auto bg-white min-h-screen font-sans text-gray-800 shadow-2xl relative pb-20 sm:pb-0">
                    <div className="flex justify-between items-center px-4 py-4 bg-teal-700 text-white shadow-md">
                        <h1 className="text-xl font-black tracking-wider flex items-center gap-2"><i className="fa-regular fa-calendar-check"></i> MYSHIFTS</h1>
                        <div className="flex items-center gap-4">
                            {userData?.role !== 'admin' && (
                                <div className="hidden sm:flex items-center gap-2 bg-teal-800 p-1.5 rounded border border-teal-600">
                                    <input type="password" placeholder="Admin Code" className="w-24 text-xs p-1 text-gray-900 rounded outline-none" value={upgradeCode} onChange={e => setUpgradeCode(e.target.value)} />
                                    <button onClick={handleUpgradeToAdmin} className="text-xs font-bold px-2 hover:text-teal-200">Upgrade</button>
                                </div>
                            )}
                            <div className="text-right hidden sm:block">
                                <div className="text-sm font-bold">{userData?.name}</div>
                                <div className="text-xs text-teal-200 uppercase tracking-widest">{userData?.role}</div>
                            </div>
                            <button onClick={() => signOut(auth)} className="text-xs px-3 py-1.5 bg-teal-800 rounded hover:bg-teal-900 font-bold transition-colors border border-teal-600">Sign Out</button>
                        </div>
                    </div>

                    <div className="flex bg-gray-100 border-b shadow-sm overflow-x-auto hide-scrollbar sticky top-0 z-40">
                        {[
                            { id: 'MONTH', icon: 'fa-calendar-days', label: 'Month' },
                            { id: 'ROSTER', icon: 'fa-table-cells', label: 'Roster' },
                            { id: 'LIST', icon: 'fa-list', label: 'List' },
                            { id: 'MANAGE', icon: 'fa-gear', label: 'Manage' }
                        ].map(tab => {
                            if (tab.id === 'MANAGE' && userData?.role !== 'admin') return null;
                            const isActive = activeTab === tab.id;
                            return (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center justify-center gap-2 flex-1 min-w-[100px] px-4 py-3 text-xs sm:text-sm font-bold uppercase tracking-wider transition-colors border-b-4 ${isActive ? 'border-teal-600 text-teal-700 bg-white' : 'border-transparent text-gray-500 hover:text-teal-600 hover:bg-gray-50'}`}>
                                    <i className={`fa-solid ${tab.icon}`}></i> <span className="hidden sm:inline">{tab.label}</span>
                                </button>
                            );
                        })}
                    </div>

                    <div className="p-0 sm:p-4 bg-gray-50/50 min-h-[calc(100vh-140px)]">
                        {activeTab === 'MANAGE' ? (
                            <ManageView shifts={shifts} staff={staff} userRole={userData?.role} />
                        ) : activeTab === 'ROSTER' ? (
                            <RosterGrid shifts={shifts} baseDate={baseDate} setBaseDate={setBaseDate} userName={userData?.name} userEmail={user.email} onShiftClick={setSelectedShift} />
                        ) : activeTab === 'MONTH' ? (
                            <MonthView shifts={shifts} baseDate={baseDate} setBaseDate={setBaseDate} userName={userData?.name} userEmail={user.email} onShiftClick={setSelectedShift} />
                        ) : (
                            <ListView shifts={shifts} userName={userData?.name} userEmail={user.email} onShiftClick={setSelectedShift} />
                        )}
                        <ShiftDetailsModal shift={selectedShift} onClose={() => setSelectedShift(null)} />
                    </div>
                </div>
            );
        }

        function RosterGrid({ shifts, baseDate, setBaseDate, userName, userEmail, onShiftClick }) {
            const anchorDate = new Date('2026-06-08T00:00:00'); 
            
            const getCycleStartDate = (targetDate) => {
                const diffTime = targetDate.getTime() - anchorDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const cycleOffset = Math.floor(diffDays / 21);
                const cycleStart = new Date(anchorDate);
                cycleStart.setDate(anchorDate.getDate() + (cycleOffset * 21));
                return cycleStart;
            };

            const currentCycleStart = getCycleStartDate(baseDate);
            
            const generateDays = () => {
                const days = [];
                for (let i = 0; i < 21; i++) {
                    const d = new Date(currentCycleStart);
                    d.setDate(currentCycleStart.getDate() + i);
                    days.push(d);
                }
                return days;
            };

            const calendarDays = generateDays();
            const weeks = [calendarDays.slice(0, 7), calendarDays.slice(7, 14), calendarDays.slice(14, 21)];
            const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            const getShiftForDay = (dateObj) => {
                const formattedDate = dateObj.toLocaleDateString('en-CA').split('T')[0];
                return shifts.find(s => s.date === formattedDate && isShiftForUser(s, userName, userEmail));
            };

            const formatDate = (date) => date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            
            const totalHours = calendarDays.reduce((sum, day) => {
                const shift = getShiftForDay(day);
                return sum + (shift ? calculateShiftHours(shift.startTime, shift.endTime) : 0);
            }, 0);

            return (
                <div className="w-full bg-white sm:border rounded sm:shadow-sm overflow-hidden">
                    <div className="p-3 border-b flex justify-between items-center bg-gray-50">
                        <button onClick={() => setBaseDate(new Date(currentCycleStart.getTime() - (21 * 24 * 60 * 60 * 1000)))} className="p-1.5 bg-white border rounded shadow-sm hover:bg-gray-100"><i className="fa-solid fa-chevron-left w-5 h-5 text-gray-600 flex items-center justify-center"></i></button>
                        <div className="text-center">
                            <div className="text-sm font-bold text-gray-700">{formatDate(calendarDays[0])} - {formatDate(calendarDays[20])}</div>
                            <div className="text-teal-700 font-black text-base mt-0.5">Total: {totalHours.toFixed(2)} h</div>
                        </div>
                        <button onClick={() => setBaseDate(new Date(currentCycleStart.getTime() + (21 * 24 * 60 * 60 * 1000)))} className="p-1.5 bg-white border rounded shadow-sm hover:bg-gray-100"><i className="fa-solid fa-chevron-right w-5 h-5 text-gray-600 flex items-center justify-center"></i></button>
                    </div>

                    <div className="overflow-x-auto">
                        <div className="min-w-[700px]">
                            <div className="grid grid-cols-[40px_1fr_1fr_1fr_1fr_1fr_1fr_1fr] bg-slate-500 text-white font-bold text-center text-sm py-1.5">
                                <div></div>{dayLabels.map(day => <div key={day}>{day}</div>)}
                            </div>
                            {weeks.map((week, wIndex) => {
                                // Simplified week number calculation
                                const d = new Date(Date.UTC(week[0].getFullYear(), week[0].getMonth(), week[0].getDate()));
                                const dayNum = d.getUTCDay() || 7;
                                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                                const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
                                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);

                                return (
                                    <div key={wIndex} className="grid grid-cols-[40px_1fr_1fr_1fr_1fr_1fr_1fr_1fr] border-b border-gray-200">
                                        <div className="bg-gray-50 flex items-center justify-center text-gray-400 text-xs font-bold border-r border-gray-200">{weekNo}</div>
                                        {week.map((day, dIndex) => {
                                            const shift = getShiftForDay(day);
                                            const isWeekend = dIndex === 5 || dIndex === 6;
                                            const isToday = new Date().toDateString() === day.toDateString();

                                            return (
                                                <div key={dIndex} onClick={() => shift && onShiftClick(shift)} className={`min-h-[100px] border-r border-gray-200 flex flex-col ${shift ? 'bg-[#e0f2fe] cursor-pointer hover:bg-blue-100 transition-colors' : 'bg-white'} ${isToday ? 'ring-2 ring-teal-500 inset-0 relative z-10' : ''}`}>
                                                    <div className={`text-right p-1 text-sm ${isWeekend ? 'text-red-600 font-bold' : 'text-gray-500'}`}>{day.getDate()}</div>
                                                    {shift && (
                                                        <div className="flex-1 flex flex-col items-center justify-center p-1 text-gray-900 pb-2">
                                                            <span className="font-extrabold text-[15px] leading-tight">{shift.startTime.replace(':','')}</span>
                                                            <span className="font-extrabold text-[15px] leading-tight mb-1">{shift.endTime.replace(':','')}</span>
                                                            <span className="text-[10px] uppercase tracking-wider text-gray-600 font-bold">{shift.location}</span>
                                                            <span className="text-[10px] leading-tight text-center px-1 text-gray-500">{shift.role}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function MonthView({ shifts, baseDate, setBaseDate, userName, userEmail, onShiftClick }) {
            const getDaysInMonth = () => {
                const year = baseDate.getFullYear();
                const month = baseDate.getMonth();
                const date = new Date(year, month, 1);
                const days = [];
                let startDay = date.getDay() === 0 ? 6 : date.getDay() - 1;
                for(let i = 0; i < startDay; i++) days.push(null);
                while (date.getMonth() === month) {
                    days.push(new Date(date));
                    date.setDate(date.getDate() + 1);
                }
                return days;
            };

            const days = getDaysInMonth();
            const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            const getShiftForDay = (dateObj) => {
                if(!dateObj) return null;
                const formattedDate = dateObj.toLocaleDateString('en-CA').split('T')[0];
                return shifts.find(s => s.date === formattedDate && isShiftForUser(s, userName, userEmail));
            };

            const totalHours = days.reduce((sum, day) => {
                if(!day) return sum;
                const shift = getShiftForDay(day);
                return sum + (shift ? calculateShiftHours(shift.startTime, shift.endTime) : 0);
            }, 0);

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            return (
                <div className="w-full bg-white sm:border rounded sm:shadow-sm overflow-hidden">
                    <div className="p-3 border-b flex justify-between items-center bg-gray-50">
                        <button onClick={() => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1))} className="p-1.5 bg-white border rounded shadow-sm hover:bg-gray-100"><i className="fa-solid fa-chevron-left w-5 h-5 text-gray-600 flex items-center justify-center"></i></button>
                        <div className="text-center">
                            <div className="text-sm font-bold text-gray-700 uppercase tracking-widest">{monthNames[baseDate.getMonth()]} {baseDate.getFullYear()}</div>
                            <div className="text-teal-700 font-black text-xs mt-0.5">Total: {totalHours.toFixed(2)} h</div>
                        </div>
                        <button onClick={() => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1))} className="p-1.5 bg-white border rounded shadow-sm hover:bg-gray-100"><i className="fa-solid fa-chevron-right w-5 h-5 text-gray-600 flex items-center justify-center"></i></button>
                    </div>

                    <div className="grid grid-cols-7 bg-slate-500 text-white font-bold text-center text-sm py-1.5">
                        {dayLabels.map(day => <div key={day}>{day}</div>)}
                    </div>
                    <div className="grid grid-cols-7 border-l border-gray-200">
                        {days.map((day, index) => {
                            const shift = getShiftForDay(day);
                            const isWeekend = index % 7 === 5 || index % 7 === 6;
                            const isToday = day && new Date().toDateString() === day.toDateString();

                            if(!day) return <div key={`empty-${index}`} className="min-h-[80px] border-r border-b border-gray-100 bg-gray-50"></div>;
                            return (
                                <div key={index} onClick={() => shift && onShiftClick(shift)} className={`min-h-[80px] border-r border-b border-gray-200 flex flex-col p-1 ${shift ? 'bg-[#e0f2fe] cursor-pointer hover:bg-blue-100 transition-colors' : 'bg-white'} ${isToday ? 'ring-2 ring-teal-500 inset-0 relative z-10' : ''}`}>
                                    <div className={`text-right text-xs ${isWeekend ? 'text-red-500 font-bold' : 'text-gray-500'}`}>{day.getDate()}</div>
                                    {shift && (
                                        <div className="mt-1 text-center flex flex-col items-center">
                                            <div className="text-xs font-bold text-teal-800 bg-teal-100/50 px-1 rounded w-full">{shift.startTime}-{shift.endTime}</div>
                                            <div className="text-[9px] text-gray-500 font-bold truncate w-full mt-0.5">{shift.location}</div>
                                        </div>
                                    )}
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        }

        function ListView({ shifts, userName, userEmail, onShiftClick }) {
            const userShifts = shifts
                .filter(s => isShiftForUser(s, userName, userEmail))
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .filter(s => new Date(s.date) >= new Date(new Date().setHours(0,0,0,0))); // Only show upcoming/today

            if (userShifts.length === 0) return <div className="p-12 text-center text-gray-400 font-medium bg-white rounded border border-dashed">No upcoming shifts.</div>;

            return (
                <div className="bg-white border rounded shadow-sm overflow-hidden">
                    <div className="bg-gray-50 p-3 border-b text-xs font-bold text-gray-500 uppercase tracking-widest flex justify-between">
                        <span>Date</span><span>Shift Details</span>
                    </div>
                    <div className="divide-y divide-gray-100">
                        {userShifts.map((shift, idx) => {
                            const dateObj = new Date(shift.date);
                            const dayName = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dateObj.getDay()];
                            return (
                                <div key={shift.id || idx} onClick={() => onShiftClick(shift)} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-gray-50 transition-colors cursor-pointer border-b border-gray-50 last:border-0">
                                    <div className="flex items-center gap-4 mb-2 sm:mb-0 w-full">
                                        <div className="bg-teal-50 border border-teal-100 text-teal-800 rounded p-2 text-center w-16 shadow-sm shrink-0">
                                            <div className="text-xs uppercase font-bold">{dayName}</div>
                                            <div className="text-lg font-black leading-none">{dateObj.getDate()}</div>
                                            <div className="text-[10px]">{dateObj.getMonth() + 1}</div>
                                        </div>
                                        <div className="flex-1">
                                            <div className="font-black text-lg text-gray-800 flex justify-between items-center w-full">
                                                <span>{shift.startTime} <span className="text-gray-400 font-medium px-1">→</span> {shift.endTime}</span>
                                                <span className="text-teal-600 bg-teal-50 px-2 py-0.5 rounded text-sm">{calculateShiftHours(shift.startTime, shift.endTime).toFixed(2)} h</span>
                                            </div>
                                            <div className="text-sm text-gray-500 flex items-center gap-2 mt-0.5">
                                                <span className="font-bold text-teal-700">{shift.location}</span> • {shift.role}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        }

        function ManageView({ shifts, staff, userRole }) {
            const emptyShift = { date: '', startTime: '', endTime: '', location: '', role: '', workerName: '', workerEmail: '' };
            const [newShift, setNewShift] = useState(emptyShift);
            const [editingId, setEditingId] = useState(null);
            
            // Replaced window.confirm with safe state UI
            const [confirmShiftDeleteId, setConfirmShiftDeleteId] = useState(null);
            const [confirmStaffDeleteId, setConfirmStaffDeleteId] = useState(null);

            const [newStaffName, setNewStaffName] = useState('');
            const [newStaffEmail, setNewStaffEmail] = useState('');
            const [editingStaffId, setEditingStaffId] = useState(null);
            const [miniCalDate, setMiniCalDate] = useState(new Date());

            const [error, setError] = useState('');
            const [message, setMessage] = useState('');

            if (userRole !== 'admin') return <div className="p-12 text-center text-red-500 font-bold">Access Denied. Admins Only.</div>;

            const handleSaveShift = async () => {
                setError(''); setMessage('');
                if(!newShift.date || !newShift.startTime || !newShift.endTime || (!newShift.workerName && newShift.workerEmail !== 'all')) {
                    setError("Please fill out Date, Times, and select an Employee.");
                    return;
                }
                try {
                    if (editingId) {
                        await updateDoc(doc(db, "shifts", editingId), newShift);
                        setMessage("Shift Updated!");
                    } else {
                        await addDoc(collection(db, "shifts"), newShift);
                        setMessage("Shift Created!");
                    }
                    // Sticky Form: Keep everything except Date & Times for fast entry
                    setNewShift({ ...newShift, date: '', startTime: '', endTime: '' });
                    setEditingId(null);
                    setTimeout(() => setMessage(''), 3000);
                } catch(err) { setError(err.message); }
            };

            const handleDeleteShift = async (id) => {
                try {
                    await deleteDoc(doc(db, "shifts", id));
                    setConfirmShiftDeleteId(null);
                } catch (err) { setError(err.message); }
            };

            const handleEditShift = (shift) => {
                setNewShift(shift); setEditingId(shift.id); setConfirmShiftDeleteId(null); window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSaveStaff = async () => {
                if(!newStaffName.trim() || !newStaffEmail.trim()) { setError("Name and Email required for staff."); return; }
                try {
                    if (editingStaffId) {
                        await updateDoc(doc(db, "staff", editingStaffId), { name: newStaffName.trim(), email: newStaffEmail.trim().toLowerCase() });
                        setMessage("Staff Updated!");
                    } else {
                        await addDoc(collection(db, "staff"), { name: newStaffName.trim(), email: newStaffEmail.trim().toLowerCase() });
                        setMessage("Staff Added!");
                    }
                    setNewStaffName(''); setNewStaffEmail(''); setEditingStaffId(null);
                    setTimeout(() => setMessage(''), 3000);
                } catch(err) { setError(err.message); }
            };

            const handleDeleteStaff = async (id) => {
                try {
                    await deleteDoc(doc(db, "staff", id));
                    setConfirmStaffDeleteId(null);
                } catch (err) { setError(err.message); }
            };

            const handleEditStaff = (s) => {
                setNewStaffName(s.name); setNewStaffEmail(s.email); setEditingStaffId(s.id); setConfirmStaffDeleteId(null);
            };

            const getMiniCalDays = () => {
                const year = miniCalDate.getFullYear();
                const month = miniCalDate.getMonth();
                const date = new Date(year, month, 1);
                const days = [];
                let startDay = date.getDay() === 0 ? 6 : date.getDay() - 1;
                for(let i = 0; i < startDay; i++) days.push(null);
                while (date.getMonth() === month) {
                    days.push(new Date(date));
                    date.setDate(date.getDate() + 1);
                }
                return days;
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
                    <div className="lg:col-span-1 space-y-6">
                        {/* Shift Form */}
                        <div className={`bg-white p-5 rounded-xl border shadow-sm transition-all ${editingId ? 'ring-2 ring-teal-500' : ''}`}>
                            <h2 className="text-sm font-black text-gray-800 mb-4 border-b pb-2 uppercase tracking-widest flex items-center justify-between">
                                {editingId ? 'Edit Shift' : 'Create Shift'}
                                {editingId && <button onClick={() => {setEditingId(null); setNewShift(emptyShift);}} className="text-xs text-gray-400 hover:text-red-500 bg-gray-100 px-2 py-1 rounded">Cancel</button>}
                            </h2>
                            {error && <div className="bg-red-50 text-red-600 p-2 text-xs rounded mb-4 font-bold border border-red-100">{error}</div>}
                            {message && <div className="bg-green-50 text-green-600 p-2 text-xs rounded mb-4 font-bold border border-green-100">{message}</div>}
                            
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Employee</label>
                                    <select className="w-full p-2 border rounded text-sm outline-none font-bold text-teal-800" value={newShift.workerEmail || ''} 
                                        onChange={e => {
                                            const selectedEmail = e.target.value;
                                            if (selectedEmail === 'all') {
                                                setNewShift({...newShift, workerEmail: 'all', workerName: 'All Staff'});
                                            } else {
                                                const selectedStaff = staff.find(s => s.email === selectedEmail);
                                                setNewShift({...newShift, workerEmail: selectedStaff?.email || '', workerName: selectedStaff?.name || ''});
                                            }
                                        }}>
                                        <option value="">-- Select --</option>
                                        <option value="all">All Staff</option>
                                        {staff.map(s => <option key={s.id} value={s.email}>{s.name} ({s.email})</option>)}
                                    </select>
                                </div>

                                {/* Mini Quick-Pick Calendar */}
                                {newShift.workerEmail && !editingId && (
                                    <div className="bg-white border rounded shadow-sm p-3 mt-2">
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-2">Quick Date</label>
                                        <div className="flex justify-between items-center mb-2">
                                            <button onClick={() => setMiniCalDate(new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() - 1, 1))} className="text-gray-400 hover:text-teal-600 p-1"><i className="fa-solid fa-chevron-left"></i></button>
                                            <span className="text-[10px] font-bold text-gray-600 uppercase tracking-widest">
                                                {miniCalDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}
                                            </span>
                                            <button onClick={() => setMiniCalDate(new Date(miniCalDate.getFullYear(), miniCalDate.getMonth() + 1, 1))} className="text-gray-400 hover:text-teal-600 p-1"><i className="fa-solid fa-chevron-right"></i></button>
                                        </div>
                                        <div className="grid grid-cols-7 gap-1 text-center mb-1">
                                            {['M','T','W','T','F','S','S'].map((d, i) => <div key={i} className="text-[8px] text-gray-400 font-bold">{d}</div>)}
                                        </div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {getMiniCalDays().map((day, idx) => {
                                                if (!day) return <div key={`e-${idx}`} className="h-6"></div>;
                                                const year = day.getFullYear();
                                                const month = String(day.getMonth() + 1).padStart(2, '0');
                                                const dNum = String(day.getDate()).padStart(2, '0');
                                                const formattedDate = `${year}-${month}-${dNum}`;
                                                
                                                const hasShift = shifts.some(s => s.date === formattedDate && s.workerEmail === newShift.workerEmail);
                                                const isSelected = newShift.date === formattedDate;
                                                const isToday = new Date().toDateString() === day.toDateString();

                                                return (
                                                    <div key={idx} 
                                                        onClick={() => setNewShift({...newShift, date: formattedDate})}
                                                        className={`h-7 flex flex-col items-center justify-center rounded cursor-pointer transition-colors relative
                                                            ${isSelected ? 'bg-teal-600 text-white font-bold shadow-md' : 'bg-gray-50 hover:bg-teal-50 text-gray-700'}
                                                            ${isToday && !isSelected ? 'border border-teal-500' : 'border border-transparent'}
                                                        `}>
                                                        <span className="text-[10px]">{day.getDate()}</span>
                                                        {hasShift && <div className={`w-1 h-1 rounded-full absolute bottom-0.5 ${isSelected ? 'bg-white' : 'bg-teal-500'}`}></div>}
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}
                                {editingId && (
                                     <div>
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Date</label>
                                        <input type="date" className="w-full p-2 border rounded text-sm outline-none" value={newShift.date} onChange={e => setNewShift({...newShift, date: e.target.value})} />
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Start Time</label>
                                        <input type="time" className="w-full p-2 border rounded text-sm outline-none" value={newShift.startTime} onChange={e => setNewShift({...newShift, startTime: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">End Time</label>
                                        <input type="time" className="w-full p-2 border rounded text-sm outline-none" value={newShift.endTime} onChange={e => setNewShift({...newShift, endTime: e.target.value})} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Location Code</label>
                                        <input type="text" placeholder="e.g. TNT" className="w-full p-2 border rounded text-sm uppercase outline-none" value={newShift.location} onChange={e => setNewShift({...newShift, location: e.target.value.toUpperCase()})} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Role</label>
                                        <input type="text" placeholder="e.g. MPS" className="w-full p-2 border rounded text-sm outline-none" value={newShift.role} onChange={e => setNewShift({...newShift, role: e.target.value})} />
                                    </div>
                                </div>
                            </div>
                            
                            <button onClick={handleSaveShift} className={`mt-4 w-full text-white p-3 rounded font-black uppercase tracking-widest shadow-md transition-all ${editingId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-teal-600 hover:bg-teal-700'}`}>
                                {editingId ? 'Update Shift' : 'Publish Shift'}
                            </button>
                            {!editingId && <button onClick={() => setNewShift(emptyShift)} className="mt-2 w-full text-xs text-gray-400 py-1 hover:text-gray-600">Clear Form</button>}
                        </div>

                        {/* Staff Directory */}
                        <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h2 className="text-sm font-black text-gray-800 mb-3 uppercase tracking-widest flex items-center gap-2"><i className="fa-solid fa-user-plus"></i> Staff Directory</h2>
                            <div className="space-y-2 mb-4">
                                <input type="text" placeholder="Name" className="w-full p-2 border rounded text-sm outline-none" value={newStaffName} onChange={e => setNewStaffName(e.target.value)} />
                                <input type="email" placeholder="Email (must match their login)" className="w-full p-2 border rounded text-sm outline-none" value={newStaffEmail} onChange={e => setNewStaffEmail(e.target.value)} />
                                <div className="flex gap-2">
                                    <button onClick={handleSaveStaff} className="flex-1 bg-gray-800 text-white px-3 py-2 rounded text-xs font-bold hover:bg-black transition-colors">
                                        {editingStaffId ? 'Update Staff' : 'Add Staff'}
                                    </button>
                                    {editingStaffId && (
                                        <button onClick={() => {setEditingStaffId(null); setNewStaffName(''); setNewStaffEmail('');}} className="bg-gray-200 text-gray-600 px-3 py-2 rounded text-xs font-bold hover:bg-gray-300 transition-colors">
                                            Cancel
                                        </button>
                                    )}
                                </div>
                            </div>
                            <div className="flex flex-col gap-2">
                                {staff.map(s => (
                                    <div key={s.id} className={`bg-white border p-2 rounded text-xs shadow-sm flex justify-between items-center transition-all ${editingStaffId === s.id ? 'ring-2 ring-teal-500' : ''}`}>
                                        <div>
                                            <div className="font-bold">{s.name}</div>
                                            <div className="text-[10px] text-gray-500">{s.email}</div>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <button onClick={() => handleEditStaff(s)} className="text-gray-400 hover:text-teal-600 p-1.5 rounded hover:bg-gray-50 transition-colors"><i className="fa-solid fa-pen"></i></button>
                                            {confirmStaffDeleteId === s.id ? (
                                                <div className="flex items-center gap-1 bg-red-50 px-1.5 py-1 rounded border border-red-100">
                                                    <button onClick={() => handleDeleteStaff(s.id)} className="text-[10px] font-bold text-red-600 hover:underline">Yes</button>
                                                    <span className="text-gray-300 text-[10px]">|</span>
                                                    <button onClick={() => setConfirmStaffDeleteId(null)} className="text-[10px] font-bold text-gray-500 hover:underline">No</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setConfirmStaffDeleteId(s.id)} className="text-red-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50 transition-colors"><i className="fa-solid fa-trash"></i></button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-2 bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col h-[600px]">
                        <div className="bg-gray-50 p-4 border-b">
                            <h3 className="font-black text-gray-800 uppercase tracking-widest">Active Shift Database</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {shifts.sort((a,b) => new Date(b.date) - new Date(a.date)).map(s => (
                                <div key={s.id} className={`flex flex-col sm:flex-row justify-between sm:items-center p-4 border rounded-lg transition-colors ${editingId === s.id ? 'bg-orange-50 border-orange-200' : 'hover:bg-gray-50 border-gray-100'}`}>
                                    <div className="flex items-center gap-4 mb-3 sm:mb-0">
                                        <div className="bg-gray-100 text-gray-600 font-bold px-3 py-2 rounded text-sm font-mono border w-24 text-center">{s.date}</div>
                                        <div>
                                            <div className="font-black text-teal-800">{s.workerName || s.worker}</div>
                                            <div className="text-xs text-gray-500 font-bold mt-0.5">
                                                {s.startTime} - {s.endTime} <span className="mx-1">•</span> <span className="text-gray-800">{s.location}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => handleEditShift(s)} className="bg-white border text-gray-600 hover:text-teal-600 px-3 py-1.5 rounded text-xs font-bold transition-colors shadow-sm"><i className="fa-solid fa-pen"></i> Edit</button>
                                        
                                        {confirmShiftDeleteId === s.id ? (
                                            <div className="flex items-center gap-2 bg-red-50 border border-red-100 px-2 py-1 rounded shadow-sm">
                                                <span className="text-[10px] font-bold text-red-600 uppercase tracking-widest">Delete?</span>
                                                <button onClick={() => handleDeleteShift(s.id)} className="text-xs font-bold text-red-700 hover:underline">Yes</button>
                                                <span className="text-gray-300">|</span>
                                                <button onClick={() => setConfirmShiftDeleteId(null)} className="text-xs font-bold text-gray-500 hover:underline">No</button>
                                            </div>
                                        ) : (
                                            <button onClick={() => setConfirmShiftDeleteId(s.id)} className="bg-white border border-red-100 text-red-500 hover:bg-red-50 px-3 py-1.5 rounded text-xs font-bold transition-colors shadow-sm"><i className="fa-solid fa-trash"></i></button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AuthScreen() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState('employee');
            const [adminCode, setAdminCode] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault(); setError(''); setLoading(true);
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        if (role === 'admin' && adminCode !== 'ADMIN2026') throw new Error("Invalid Admin Passcode.");
                        if (!name) throw new Error("Full Name is required.");
                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, "users", cred.user.uid), { name, email: email.toLowerCase(), role });
                    }
                } catch (err) { setError(err.message); } 
                finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
                    <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
                        <i className="fa-solid fa-shield-halved text-5xl text-teal-600 mb-4 block"></i>
                        <h2 className="text-3xl font-extrabold text-gray-900">MyShifts</h2>
                        <p className="mt-2 text-sm text-gray-600">Sign in to access your schedule</p>
                    </div>

                    <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                        <div className="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100">
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm font-bold">{error}</div>}
                            <form className="space-y-6" onSubmit={handleAuth}>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase">Email</label>
                                    <input type="email" required className="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 font-medium outline-none" value={email} onChange={e => setEmail(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase">Password</label>
                                    <input type="password" required className="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 font-medium outline-none" value={password} onChange={e => setPassword(e.target.value)} />
                                </div>
                                {!isLogin && (
                                    <div className="space-y-4 bg-gray-50 p-4 border rounded-md">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase">Full Name</label>
                                            <input type="text" required={!isLogin} className="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 font-medium outline-none" value={name} onChange={e => setName(e.target.value)} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase">Account Role</label>
                                            <select className="mt-1 block w-full px-3 py-2 border rounded-md bg-white outline-none" value={role} onChange={e => setRole(e.target.value)}>
                                                <option value="employee">Standard Employee</option>
                                                <option value="admin">Administrator</option>
                                            </select>
                                        </div>
                                        {role === 'admin' && (
                                            <div className="bg-red-50 p-3 rounded border border-red-200">
                                                <label className="block text-xs font-bold text-red-700 uppercase">Admin Passcode</label>
                                                <input type="password" placeholder="Enter secret code" required={role === 'admin'} className="mt-1 block w-full px-3 py-2 border border-red-300 rounded-md focus:ring-red-500 focus:border-red-500 font-mono outline-none" value={adminCode} onChange={e => setAdminCode(e.target.value)} />
                                            </div>
                                        )}
                                    </div>
                                )}
                                <button type="submit" disabled={loading} className="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-md text-sm font-bold uppercase tracking-widest text-white bg-teal-600 hover:bg-teal-700 disabled:opacity-50 transition-colors">
                                    {loading ? 'Processing...' : (isLogin ? 'Sign In' : 'Create Account')}
                                </button>
                            </form>
                            <div className="mt-6 text-center">
                                <button onClick={() => setIsLogin(!isLogin)} type="button" className="text-sm font-bold text-teal-600 hover:text-teal-500 transition-colors">
                                    {isLogin ? "Need an account? Sign up" : "Already registered? Sign in"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Initialize React Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MyShiftsApp />);
    </script>
</body>
</html>
